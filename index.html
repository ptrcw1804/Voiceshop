function renderMenu(){
const menu=document.getElementById("menu");
menu.innerHTML="";

const filteredItems = menuData.filter(item =>
currentFilter==="all" || item.filter===currentFilter
);

// ⭐ แสดงจำนวนสินค้า
document.getElementById("productCount").innerHTML =
currentLang==="th"
? `📦 มีสินค้าทั้งหมด ${filteredItems.length} รายการ`
: `📦 Total ${filteredItems.length} products`;

filteredItems.forEach(item=>{
const data=item[currentLang];
menu.innerHTML+=`
<div class="menu-item" onclick="showDetail('${data.name}','${data.price}','${data.desc}')">
<div class="image-slider">
  <button class="prev" onclick="changeImage(event,-1)">❮</button>
  <img src="${Array.isArray(item.img)?item.img[0]:item.img}" data-images='${JSON.stringify(item.img)}' data-index="0">
  <button class="next" onclick="changeImage(event,1)">❯</button>
</div>
<h3>${data.name}</h3>
<p class="price">${data.price}</p>
</div>`;
});
}

function changeImage(event,direction){
event.stopPropagation();

const container = event.target.parentElement;
const img = container.querySelector("img");

let images = JSON.parse(img.dataset.images);
if(!Array.isArray(images)) return;

let index = parseInt(img.dataset.index);
index += direction;

if(index < 0) index = images.length-1;
if(index >= images.length) index = 0;

img.src = images[index];
img.dataset.index = index;
}

function setFilter(value){
currentFilter=value;
renderMenu();
}

function showDetail(name,price,desc){

const item = menuData.find(p =>
p[currentLang].name === name
);

const data = item[currentLang];

currentSpeechText = `
${data.name}.
${data.price}.
${data.desc || ""}.
${currentLang==="th"?"วิธีรับประทาน":"How to enjoy"}.
${data.how || ""}.
${currentLang==="th"?"ประโยชน์":"Benefits"}.
${data.benefit || ""}
`;

document.getElementById("detail").innerHTML=
`
<span class="close-btn" onclick="closeModal()">✖</span>

<h2>${data.name}</h2>
<p><strong>${data.price}</strong></p>
<p>${data.desc || ""}</p>

<hr style="margin:15px 0;">

<h3>${currentLang==="th"?"วิธีรับประทาน : ":"How to Enjoy : "}</h3>
<p>${data.how || "-"}</p>

<h3>${currentLang==="th"?"ประโยชน์ : ":"Benefits : "}</h3>
<p>${data.benefit || "-"}</p>

<button class="speak-btn" onclick="speak()">
🔊 ${currentLang==="th"?"ฟังเสียง":"Listen"}
</button>
`;

document.getElementById("productModal").style.display="flex";
}

function speak(){
if(!currentSpeechText) return;

const speech = new SpeechSynthesisUtterance(currentSpeechText);
speech.lang = currentLang==="th" ? "th-TH" : "en-US";

window.speechSynthesis.cancel();
window.speechSynthesis.speak(speech);
}

function closeModal(){
document.getElementById("productModal").style.display="none";
}

function setLanguage(lang,event){
currentLang=lang;
currentFilter="all";

document.querySelectorAll(".top-bar button")
.forEach(btn=>btn.classList.remove("active"));

event.target.classList.add("active");

// ⭐ เพิ่ม 3 บรรทัดนี้
renderDropdown();
renderMenu();
updateUIText();
}



// แสดงปุ่มเมื่อเลื่อนลง
window.onscroll = function(){
const btn = document.getElementById("scrollTopBtn");

if(document.documentElement.scrollTop > 200){
btn.style.display = "block";
}else{
btn.style.display = "none";
}
};

// กดแล้วเลื่อนขึ้นบนแบบนุ่ม ๆ
function scrollToTop(){
window.scrollTo({
top:0,
behavior:"smooth"
});
}

document.addEventListener("DOMContentLoaded", function() {
  renderDropdown();
  renderMenu();
  updateUIText();
});
