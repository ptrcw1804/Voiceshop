<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hill Tribe Cocoa Cof</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">


<style>
body{
margin:0;
font-family:'Kanit',sans-serif;
background:#f6f1eb;
color:#4b3832;
}

header{
background:#6f4e37;
color:white;
text-align:center;
padding:1px;
}

.logo{
width:100px;
height:100px;
object-fit:cover;
border-radius:50%;
border:4px solid white;
margin-top:20px;
margin-bottom:1px;
}

.top-bar{
text-align:center;
margin:20px 0;
}

select,button{
padding:8px 15px;
border-radius:20px;
border:none;
margin:5px;
font-family:'Kanit',sans-serif;
background:#d9c2ad;
cursor:pointer;
}

.active{
background:white;
font-weight:bold;
}

/* ⭐ แก้ layout ใหม่ให้สวยและกลางเสมอ */
.menu-container{
display:grid;
grid-template-columns:repeat(auto-fit,220px);
justify-content:center;
gap:40px;
padding:40px;
}

.menu-item{
width:220px;
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
transition:0.3s;
}

.menu-item:hover{
transform:scale(1.05);
}

.menu-item img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#8b5e3c;
font-weight:bold;
}

.detail-box{
background:white;
margin:20px auto;
padding:25px;
border-radius:15px;
text-align:center;
max-width:600px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.speak-btn{
background:#8b5e3c;
color:white;
margin-top:10px;
}

.detail-box h3{
color:#8b5e3c;
margin-bottom:5px;
}

/* ⭐ Modal Popup */
.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
width:90%;
max-width:600px;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
max-height:80vh;
overflow-y:auto;
position:relative;
}

.close-btn{
position:absolute;
top:10px;
right:15px;
font-size:20px;
cursor:pointer;
color:#8b5e3c;
}

.ask-section {
  text-align: center;
  margin: 30px 0 50px 0;
}

.ask-btn {
  display: inline-block;
  background-color: #6f4e37;
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  text-decoration: none;
  font-size: 16px;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.ask-btn:hover {
  background-color: #8b5e3c;
  transform: scale(1.05);
}
</style>
</head>

<body>

<header>
<img src="img/cocoa_doi_logo.jpg" class="logo">
<h1>Hill Tribe Cocoa Cof</h1>
<p id="tagline">โกโก้แท้จากคนดอย</p>
</header>

<div class="top-bar">
<button class="active" onclick="setLanguage('th',event)">ไทย</button>
<button onclick="setLanguage('en',event)">English</button>

<select id="productSelect" onchange="setFilter(this.value)">
</select>
</div>

<div class="menu-container" id="menu"></div>



<script>
let currentLang="th";
let currentFilter="all";
let currentSpeechText="";

const menuData=[

{filter:"raw",img:"img/cacao_pod.jpg",
th:{name:"ผลโกโก้สด",price:"8-10 บาท/กิโลกรัม",desc:"ผลสดจากสวนบนดอย"},

en:{name:"Cacao Beans",price:"100 Baht (100 gram)",desc:"Raw cacao beans from mountain farm."}},

en:{name:"Cocoa Butter",price:"? Baht",desc:""}},

{filter:"raw",img:"img/cacao_mass.jpg",
th:{name:"โกโก้แมส",price:"300 บาท (250กรัม)",desc:""},
en:{name:"Cacao Mass",price:"300 Baht (250 gram)",desc:""}},

{filter:"nibs",img:"img/cocoa_nibs.jpg",
th:{name:"โกโก้นิบส์",price:"? บาท",desc:""},

{filter:"drink",img:"img/cocoa_water.jpg",
th:{name:"น้ำโกโก้สด",price:"80 บาท",desc:"เครื่องดื่มจากเยื่อโกโก้",how:"แช่เย็นก่อนดื่ม เขย่าก่อนเปิด",
benefit:"สดชื่น มีวิตามินธรรมชาติ"},

benefit:"Naturally refreshing and rich in vitamins"}},

{filter:"alcohol",img:"img/cocoa_wine.jpg",
th:{name:"Cocoa Cider Wine",price:"250 บาท",desc:"ไวน์หมักจากเยื่อโกโก้"},
en:{name:"Cocoa Cider Wine",price:"250 Baht",desc:"Fermented cacao pulp wine."}},

{filter:"alcohol",img:"img/cocoa_whiskey.jpg",
th:{name:"Cocoa Whiskey",price:"250 บาท",desc:""},
en:{name:"Cocoa Whiskey",price:"250 Baht",desc:""}},

{filter:"dark",img:"img/dark100.jpg",

en:{name:"Dark Chocolate 100%",price:"120 Baht",desc:""}},

{filter:"dark",img:"img/dark_alm80.jpg",
th:{name:"ดาร์กช็อกโกแลต 80% <br>รสอัลมอนด์</br>",price:"120 บาท",desc:""},
en:{name:"Dark Chocolate 80% Almond Flavor",price:"120 Baht",desc:""}},

{filter:"dark",img:"img/dark_.jpg",
th:{name:"ดาร์กช็อกโกแลต 70% <br>เชียงใหม่ ออริจิน</br>",price:"120 บาท",desc:""},
en:{name:"Dark Chocolate 70% Chiang Mai Origin",price:"120 Baht",desc:""}},

{filter:"dark",img:"img/dark_gin70.jpg",

en:{name:"Dark Chocolate 70% Ginger Flavor",price:"120 Baht",desc:""}},

{filter:"dark",img:"img/dark_.jpg",
th:{name:"ดาร์กช็อกโกแลต 70% <br>รสน้ำตาลดอกมะพร้าว</br>",price:"120 บาท",desc:""},
en:{name:"Dark Chocolate 70% Coconut Blossom Sugar Flavor",price:"120 Baht",desc:""}},

en:{name:"White Chocolate 34% Milk Almond Flavor",price:"120 Baht",desc:""}},

{filter:"white",img:"img/white_mpe34.jpg",
th:{name:"ไวท์ช็อกโกแลต 34% <br>รสนมพีช</br>",price:"120 บาท",desc:""},
en:{name:"White Chocolate 34% Milk Peach Flavor",price:"120 Baht",desc:""}},

{filter:"white",img:"img/white_.jpg",
th:{name:"ไวท์ช็อกโกแลต 34% <br>รสนม</br>",price:"120 บาท",desc:""},
en:{name:"White Chocolate 34% Milk Flavor",price:"120 Baht",desc:""}},

{filter:"honey",img:"img/cocoa_honey.jpg",

en:{name:"Honey Cocoa Garden",price:"250 Baht",desc:""}}



];

function renderDropdown(){
const select=document.getElementById("productSelect");

if(currentLang==="th"){
select.innerHTML=`
<option value="all">-- เลือกหมวดสินค้า --</option>
<optgroup label="วัตถุดิบ">
<option value="raw">วัตถุดิบโกโก้</option>
<option value="nibs">โกโก้นิบส์</option>
</optgroup>
<optgroup label="ผลิตภัณฑ์แปรรูป">
<option value="drink">เครื่องดื่ม</option>
<option value="alcohol">แอลกอฮอล์</option>
<option value="honey">น้ำผึ้ง</option>
</optgroup>
<optgroup label="ช็อกโกแลต">
<option value="dark">ดาร์กช็อกโกแลต</option>
<option value="white">ไวท์ช็อกโกแลต</option>
</optgroup>
`;
}else{
select.innerHTML=`
<option value="all">-- Select Product Category --</option>
<optgroup label="Raw Materials">
<option value="raw">Cacao Raw</option>
<option value="nibs">Cocoa Nibs</option>
</optgroup>
<optgroup label="Processed Products">
<option value="drink">Drinks</option>
<option value="alcohol">Alcohol</option>
<option value="honey">Honey</option>
</optgroup>
<optgroup label="Chocolate">
<option value="dark">Dark Chocolate</option>
<option value="white">White Chocolate</option>
</optgroup>
`;
}

select.value=currentFilter;
}

function renderMenu(){
const menu=document.getElementById("menu");
menu.innerHTML="";

menuData
.filter(item=>currentFilter==="all"||item.filter===currentFilter)
.forEach(item=>{
const data=item[currentLang];
menu.innerHTML+=`
<div class="menu-item" onclick="showDetail('${data.name}','${data.price}','${data.desc}')">
<img src="${item.img}">
<h3>${data.name}</h3>
<p class="price">${data.price}</p>
</div>`;
});
}

function setFilter(value){
currentFilter=value;
renderMenu();
}

function showDetail(name,price,desc){

const item = menuData.find(p =>
p[currentLang].name === name
);

const data = item[currentLang];

currentSpeechText = `
${data.name}.
${data.price}.
${data.desc || ""}.
${currentLang==="th"?"วิธีรับประทาน":"How to enjoy"}.
${data.how || ""}.
${currentLang==="th"?"ประโยชน์":"Benefits"}.
${data.benefit || ""}
`;

document.getElementById("detail").innerHTML=
`
<span class="close-btn" onclick="closeModal()">✖</span>

<h2>${data.name}</h2>
<p><strong>${data.price}</strong></p>
<p>${data.desc || ""}</p>

<hr style="margin:15px 0;">

<h3>${currentLang==="th"?"วิธีรับประทาน":"How to Enjoy"}</h3>
<p>${data.how || "-"}</p>

<h3>${currentLang==="th"?"ประโยชน์":"Benefits"}</h3>
<p>${data.benefit || "-"}</p>

<button class="speak-btn" onclick="speak()">
🔊 ${currentLang==="th"?"ฟังเสียง":"Listen"}
</button>
`;

document.getElementById("productModal").style.display="flex";
}

function speak(){
if(!currentSpeechText) return;

const speech = new SpeechSynthesisUtterance(currentSpeechText);
speech.lang = currentLang==="th" ? "th-TH" : "en-US";

window.speechSynthesis.cancel();
window.speechSynthesis.speak(speech);
}

function closeModal(){
document.getElementById("productModal").style.display="none";
}

function setLanguage(lang,event){
currentLang=lang;
currentFilter="all";

document.querySelectorAll(".top-bar button")
.forEach(btn=>btn.classList.remove("active"));

event.target.classList.add("active");

renderDropdown();
renderMenu();
}

renderDropdown();
renderMenu();


</script>

<div class="modal" id="productModal">
<div class="modal-content" id="detail">
<span class="close-btn" onclick="closeModal()">✖</span>
</div>
</div>

<div class="ask-section">
  <a href="ask.html" class="ask-btn">💬 คำถามยอดฮิต
</a>
</div>

<script src="script.js"></script>

</body>
</html>
