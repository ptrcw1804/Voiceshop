<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aroma Café</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Kanit', sans-serif;
  background-color: #f6f1eb;
  color: #4b3832;
}

header {
  background-color: #6f4e37;
  color: white;
  padding: 20px;
  text-align: center;
}

.lang-btn, .cat-btn {
  font-family: 'Kanit', sans-serif;
  padding: 6px 14px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background-color: #d9c2ad;
  color: #4b3832;
}

.active {
  background-color: white;
  font-weight: bold;
}

.category-bar {
  text-align: center;
  margin: 15px 0;
}

.menu-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

.menu-item {
  background: white;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  transform: scale(1.03);
}

.menu-item img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
}

.price {
  color: #8b5e3c;
  font-weight: bold;
}

.detail-box {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 15px;
  min-height: 80px;
  text-align: center;
}

.ask-section {
  text-align: center;
  margin: 30px 0 50px 0;
}

.ask-btn {
  display: inline-block;
  background-color: #6f4e37;
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  text-decoration: none;
  font-size: 16px;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.ask-btn:hover {
  background-color: #8b5e3c;
  transform: scale(1.05);
}

h1{
  font-size: 40px;
}
</style>
</head>

<body>

<header>
  <h1>☕ Aroma Café</h1>
  <button class="lang-btn active" onclick="setLanguage('th', event)">ไทย</button>
  <button class="lang-btn" onclick="setLanguage('en', event)">English</button>
</header>

<div class="category-bar">
  <button class="cat-btn active" onclick="setCategory('drinks', event)">Drinks</button>
  <button class="cat-btn" onclick="setCategory('bakery', event)">Bakery</button>
</div>

<div class="menu-container" id="menu"></div>

<div class="detail-box" id="detail">
  กรุณาเลือกเมนู
</div>

<script>
let currentLang = "th";
let currentCategory = "drinks";

const menuData = [
  {category:"drinks", img:"https://doithaicoffee.com/wp-content/uploads/2022/04/cup-of-latte-art.jpg",
    th:{name:"ลาเต้",price:"65 บาท",desc:"กาแฟผสมนมสด หอมละมุน"},
    en:{name:"Latte",price:"65 THB",desc:"Smooth coffee with milk."}},

  {category:"drinks", img:"https://www.nespresso.com/ecom/medias/sys_master/public/45936680796190/shutterstock-1074209732-1024x683.jpg",
  th: { name: "คาปูชิโน่", price: "70 บาท", desc: "กาแฟเข้มข้น พร้อมฟองนมนุ่มละมุน" },
    en: { name: "Cappuccino", price: "70 THB", desc: "Strong coffee topped with creamy milk foam." }},
      
  {category:"drinks", img:"https://media.istockphoto.com/id/1371303553/photo/coffee-and-chocolate-cocktail-with-whipped-cream.jpg?s=612x612&w=0&k=20&c=O3ZIVpWd6ADADg0ELcjkqD1qkWPJsvKE4AU_yoLdm5Y=",
    th:{name:"มอคค่า",price:"75 บาท",desc:"กาแฟผสมช็อกโกแลตเข้มข้น"},
    en:{name:"Mocha",price:"75 THB",desc:"Espresso with rich chocolate."}},
    
  {category:"drinks", img:"https://images.unsplash.com/photo-1553530666-ba11a7da3888",
    th:{name:"สตรอว์เบอร์รี่สมูทตี้",price:"80 บาท",desc:"สมูทตี้ผลไม้สด สดชื่น"},
    en:{name:"Strawberry Smoothie",price:"80 THB",desc:"Fresh strawberry smoothie."}},

  {category:"drinks", img:"https://image.makewebeasy.net/makeweb/m_1920x0/W7OuxZEpB/DefaultData/%E0%B8%8A%E0%B8%B2%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%96%E0%B8%B8%E0%B8%94%E0%B8%B4%E0%B8%9A_09.jpg?v=202405291424",
    th: { name: "ชาไทยเย็น", price: "60 บาท", desc: "ชาไทยหอมหวาน เสิร์ฟเย็นสดชื่น" },
  en: { name: "Thai Iced Tea", price: "60 THB", desc: "Sweet and creamy Thai tea served over ice." }},

  

  {category:"bakery", img:"https://media.istockphoto.com/id/1456338180/th/%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%96%E0%B9%88%E0%B8%B2%E0%B8%A2/%E0%B8%AD%E0%B8%B2%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%8A%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A7%E0%B8%B2%E0%B8%99%E0%B8%8A%E0%B8%B2%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%8A%E0%B8%B5%E0%B8%AA%E0%B9%80%E0%B8%84%E0%B9%89%E0%B8%81%E0%B9%81%E0%B8%AA%E0%B8%99%E0%B8%AD%E0%B8%A3%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B8%AD%E0%B9%80%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%A3%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%94%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%AA%E0%B8%B0%E0%B8%A3%E0%B8%B0%E0%B9%81%E0%B8%AB%E0%B8%99%E0%B9%88%E0%B8%AA%E0%B8%B9%E0%B8%95%E0%B8%A3%E0%B9%82%E0%B8%AE%E0%B8%A1%E0%B9%80%E0%B8%A1%E0%B8%94%E0%B9%82%E0%B8%94%E0%B8%A2%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AD%E0%B8%9A%E0%B8%9A%E0%B8%99.jpg?s=612x612&w=0&k=20&c=u4xUObKCLg0p1zbmPcMCOPVqZsFhPaqyYpS2yPi89Kc=",
    th:{name:"ชีสเค้ก",price:"85 บาท",desc:"ชีสเค้กเนื้อนุ่ม หวานกำลังดี"},
    en:{name:"Cheesecake",price:"85 THB",desc:"Soft and creamy cheesecake."}},
    
  {category:"bakery", img:"https://assets.flowerstore.ph/public/tenantTH/app/assets/images/meta/300_cyDKZ1gFHSU03mmljvV5VQGMc.webp",
    th:{name:"เค้กช็อกโกแลต",price:"90 บาท",desc:"เค้กช็อกโกแลตเข้มข้น"},
    en:{name:"Chocolate Cake",price:"90 THB",desc:"Rich chocolate cake."}},
    
  {category:"bakery", img:"https://th-images.th-hellomagazine.com/wp-content/uploads/2023/02/17124934/%E0%B8%AE%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%82%E0%B8%97%E0%B8%AA%E0%B8%95%E0%B9%8C_f.jpg?tr=w-1200,h-900",
    th:{name:"ฮันนี่โทสต์",price:"120 บาท",desc:"ขนมปังอบกรอบ เสิร์ฟพร้อมไอศกรีม"},
    en:{name:"Honey Toast",price:"120 THB",desc:"Toasted bread with ice cream."}},

  {category:"bakery", img: "https://png.pngtree.com/background/20230616/original/pngtree-brownies-a-classic-chocolate-dessert-picture-image_3623891.jpg",
    th: { name: "บราวนี่", price: "50 บาท", desc: "บราวนี่เข้มข้น หอมช็อกโกแลตแท้" },
    en: { name: "Brownie", price: "50 THB", desc: "Rich chocolate brownie with intense flavor." }},

  {category:"bakery", img: "https://www.silpa-mag.com/wp-content/uploads/2024/07/bread-1284438_1280.jpg",
  th: { name: "ครัวซองต์", price: "55 บาท", desc: "ครัวซองต์อบใหม่ กรอบนอกนุ่มใน" },
  en: { name: "Croissant", price: "55 THB", desc: "Freshly baked croissant, crispy outside and soft inside." }}
];

function renderMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  menuData.filter(item => item.category === currentCategory)
  .forEach(item => {
    const data = item[currentLang];
    menu.innerHTML += `
      <div class="menu-item" onclick="showDetail('${data.name}','${data.price}','${data.desc}')">
        <img src="${item.img}">
        <h3>${data.name}</h3>
        <p class="price">${data.price}</p>
      </div>
    `;
  });
}

function showDetail(name, price, desc) {
  document.getElementById("detail").innerHTML =
    `<h2>${name}</h2><p><strong>${price}</strong></p><p>${desc}</p>`;
  
  const speech = new SpeechSynthesisUtterance(`${name} ${price}. ${desc}`);
  speech.lang = currentLang === "th" ? "th-TH" : "en-US";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function setLanguage(lang, event) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  renderMenu();
}

function setCategory(cat, event) {
  currentCategory = cat;
  document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  renderMenu();
}

renderMenu();
</script>

<div class="ask-section">
  <a href="ask.html" class="ask-btn">💬 คำถามยอดฮิต
</a>
</div>

</body>
</html>
